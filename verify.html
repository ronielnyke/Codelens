<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <title>Verify License</title>
  </head>
  <body>
    <div id="nav"></div>
    <main class="container py-4" style="max-width: 640px">
      <h2>Verify a license key</h2>
      <p class="muted">
        Enter the key from the header of the purchased code to check it is
        genuine.
      </p>
      <div class="panel">
        <input
          id="k"
          class="form-control mb-3"
          placeholder="CL-XXXX-XXXX-XXXX"
        /><button class="btn btn-mint" id="v">Verify</button>
        <div id="r" class="mt-3"></div>
      </div>
    </main>
    <div id="foot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/chrome.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module">
      import { esc, db, fire, ready } from "./js/app.js";
      await ready;
      document.getElementById("v").onclick = async () => {
        const k = document.getElementById("k").value.trim().toUpperCase(),
          r = document.getElementById("r");
        if (!/^CL-[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}$/.test(k)) {
          r.innerHTML = '<div class="text-danger">Invalid key format.</div>';
          return;
        }
        try {
          const s = await fire.getDoc(fire.doc(db, "licenses", k));
          r.innerHTML = s.exists()
            ? `<div class="text-success"><i class="bi bi-patch-check"></i> Genuine license.<br>Product: <b>${esc(s.data().title)}</b><br>Licensed to: ${esc(s.data().bmask)}<br>Date: ${s.data().date?.toDate().toLocaleString() || ""}</div>`
            : '<div class="text-danger"><i class="bi bi-x-octagon"></i> This key was not found.</div>';
        } catch (e) {
          r.innerHTML =
            '<div class="text-danger">Error: ' + esc(e.message) + "</div>";
        }
      };
    </script>
  </body>
</html>
