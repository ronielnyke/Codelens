<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <title>My Orders</title>
  </head>
  <body>
    <div id="nav"></div>
    <main class="container py-4">
      <h2>My Orders</h2>
      <ul class="nav nav-pills my-3">
        <li class="nav-item">
          <button
            class="nav-link active"
            data-bs-toggle="pill"
            data-bs-target="#p1"
          >
            My purchases
          </button>
        </li>
        <li class="nav-item">
          <button
            class="nav-link"
            id="tabSales"
            data-bs-toggle="pill"
            data-bs-target="#p2"
          >
            Sales to approve <span class="badge bg-danger" id="cnt"></span>
          </button>
        </li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="p1">
          <div id="mine"></div>
        </div>
        <div class="tab-pane fade" id="p2"><div id="sales"></div></div>
      </div>
    </main>
    <div id="foot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/chrome.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/orders.js"></script>
  </body>
</html>
