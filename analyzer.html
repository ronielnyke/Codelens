<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <title>Code Lens</title>
  </head>
  <body>
    <div id="nav"></div>
    <main class="container py-4">
      <h2>Code Lens</h2>
      <p class="muted">
        Paste your code. It finds errors and explains every line.
      </p>
      <div class="row g-4">
        <div class="col-lg-6">
          <div class="panel">
            <div class="d-flex gap-2 mb-2">
              <select id="lang" class="form-select w-auto">
                <option value="auto">Auto-detect</option>
                <option value="js">JavaScript</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="python">Python</option>
              </select>
              <button class="btn btn-outline-light ms-auto" id="aiBtn">
                <i class="bi bi-stars"></i> Explain with Gemini</button
              ><button class="btn btn-outline-light" id="runBtn" title="Runs JavaScript in a locked sandbox to catch runtime errors">
                <i class="bi bi-play-fill"></i> Run &amp; check</button
              ><button class="btn btn-mint" id="go">
                <i class="bi bi-search"></i> Analyze
              </button>
            </div>
            <textarea
              id="code"
              class="form-control code"
              spellcheck="false"
              placeholder="Paste your code here..."
            ></textarea>
            <div id="note" class="muted small mt-2"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="panel">
            <div class="d-flex flex-wrap gap-2 mb-3">
              <select id="voice" class="form-select w-auto"></select
              ><button class="btn btn-outline-light" id="say">
                <i class="bi bi-volume-up"></i> Read all</button
              ><button class="btn btn-outline-light" id="stop">
                <i class="bi bi-stop-fill"></i>
              </button>
            </div>
            <div id="res" class="muted">No results yet.</div>
            <div id="runRes"></div>
            <div id="ai"></div>
          </div>
        </div>
      </div>
    </main>
    <div id="foot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/chrome.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/lens.js"></script>
  </body>
</html>
