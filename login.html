<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <title>Log in - CodeLens</title>
  </head>
  <body>
    <div id="nav"></div>
    <main class="container py-4 py-lg-5">
      <div class="row g-4 align-items-stretch">
        <div class="col-lg-6 d-none d-lg-block">
          <div class="auth-art">
            <h2>Check code. Sell code. Get paid.</h2>
            <p class="muted">
              One account for the code explainer and the marketplace.
            </p>
            <div class="term" id="term"></div>
          </div>
        </div>
        <div
          class="col-lg-5 offset-lg-0 mx-auto w-100"
          style="max-width: 480px"
        >
          <div class="panel p-4">
            <div class="auth-tabs">
              <button class="on" data-t="login">Log in</button
              ><button data-t="reg">Sign up</button>
            </div>
            <button class="btn btn-light w-100 py-2" id="gl">
              <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                width="18"
                class="me-2"
                alt=""
              />Continue with Google
            </button>
            <div class="divider">or with email</div>
            <form id="fLogin" novalidate>
              <label class="form-label small muted">Email</label
              ><input
                id="le"
                type="email"
                class="form-control mb-3"
                placeholder="you@email.com"
                autocomplete="email"
              />
              <label class="form-label small muted">Password</label>
              <div class="pw mb-2">
                <input
                  id="lp"
                  type="password"
                  class="form-control"
                  placeholder="Your password"
                  autocomplete="current-password"
                /><button
                  type="button"
                  class="eye"
                  aria-label="Show or hide password"
                >
                  <i class="bi bi-eye-slash"></i>
                </button>
              </div>
              <div class="d-flex justify-content-between mb-3 small">
                <label
                  ><input type="checkbox" id="rem" checked /> Keep me signed
                  in</label
                ><a href="#" id="forgot" class="text-info">Forgot password?</a>
              </div>
              <button class="btn btn-mint w-100 py-2" id="bl">Log in</button>
            </form>
            <form id="fReg" class="d-none" novalidate>
              <label class="form-label small muted">Full name</label
              ><input
                id="rn"
                class="form-control mb-3"
                placeholder="Juan Dela Cruz"
                autocomplete="name"
              />
              <label class="form-label small muted">Email</label
              ><input
                id="re"
                type="email"
                class="form-control mb-3"
                placeholder="you@email.com"
                autocomplete="email"
              />
              <label class="form-label small muted">Password</label>
              <div class="pw">
                <input
                  id="rp"
                  type="password"
                  class="form-control"
                  placeholder="At least 6 characters"
                  autocomplete="new-password"
                /><button
                  type="button"
                  class="eye"
                  aria-label="Show or hide password"
                >
                  <i class="bi bi-eye-slash"></i>
                </button>
              </div>
              <div class="bar mt-2"><i id="sb"></i></div>
              <div class="field-note muted" id="sl"></div>
              <label class="form-label small muted mt-3"
                >Confirm password</label
              >
              <div class="pw">
                <input
                  id="rc"
                  type="password"
                  class="form-control"
                  placeholder="Type it again"
                  autocomplete="new-password"
                /><button
                  type="button"
                  class="eye"
                  aria-label="Show or hide password"
                >
                  <i class="bi bi-eye-slash"></i>
                </button>
              </div>
              <div id="cn" class="field-note mb-3"></div>
              <label class="small mb-3 d-block"
                ><input type="checkbox" id="tos" /> I agree to the
                <a href="LICENSE.txt" target="_blank" class="text-info"
                  >CodeLens License</a
                ></label
              ><button class="btn btn-mint w-100 py-2" id="br">
                Create account
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <div id="foot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/chrome.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/login.js"></script>
    <script>
      const L = [
        "> new session",
        "",
        '<span class="ok">Signed in with Google</span>',
        '<span class="ok">Welcome back. You stay signed in on this device.</span>',
        "",
        "> list code for sale ...",
        "> buyer pays via GCash ...",
        '<span class="ok">Reference verified. Code unlocked.</span>',
      ];
      const T = document.getElementById("term");
      let i = 0,
        o = "";
      (function n() {
        if (!T) return;
        if (i >= L.length) {
          T.innerHTML = o + '<span class="cursor"></span>';
          return;
        }
        o += L[i++] + "\n";
        T.innerHTML = o + '<span class="cursor"></span>';
        setTimeout(
          n,
          matchMedia("(prefers-reduced-motion:reduce)").matches ? 0 : 600,
        );
      })();
    </script>
  </body>
</html>
