<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <title>Owner Panel</title>
  </head>
  <body>
    <div id="nav"></div>
    <main class="container py-4">
      <h2>Owner Panel</h2>
      <div id="gate" class="my-4">
        <div class="muted">Checking access...</div>
      </div>
      <div id="app" class="d-none">
        <div class="row g-4">
          <div class="col-lg-4">
            <div class="panel mb-4">
              <h5>Payment details</h5>
              <p class="muted small">Shown to buyers when they pay.</p>
              <input
                id="sgn"
                class="form-control mb-2"
                placeholder="GCash number (09XXXXXXXXX)"
              /><input
                id="sgm"
                class="form-control mb-2"
                placeholder="Name on GCash account"
              /><input
                id="so"
                class="form-control mb-3"
                placeholder="Other method, optional"
              /><button class="btn btn-mint" id="saveStore">Save</button>
            </div>
            <h5>Your products</h5>
            <div id="items"></div>
          </div>
          <div class="col-lg-8">
            <div class="panel" id="form">
              <h5 id="ftitle">Add a product</h5>
              <div class="muted small mb-3" id="editNote"></div>
              <input
                id="pt"
                class="form-control mb-2"
                placeholder="Product name"
              />
              <div class="row g-2 mb-2">
                <div class="col">
                  <select id="pcat" class="form-select">
                    <option>Website</option>
                    <option>System</option>
                    <option>Script</option>
                    <option>Component</option>
                  </select>
                </div>
                <div class="col">
                  <input
                    id="pp"
                    type="number"
                    min="1"
                    class="form-control"
                    placeholder="Price (PHP)"
                  />
                </div>
              </div>
              <textarea
                id="pd"
                class="form-control mb-2"
                rows="3"
                placeholder="Description buyers will read"
              ></textarea
              ><textarea
                id="pfe"
                class="form-control mb-2"
                rows="3"
                placeholder="Features, one per line"
              ></textarea
              ><input
                id="pdm"
                class="form-control mb-3"
                placeholder="Live demo link, optional (https://...)"
              />
              <label class="form-label small muted"
                >Display images buyers can view (up to 6, the first is the
                cover)</label
              ><input
                id="pi"
                type="file"
                class="form-control mb-3"
                accept="image/*"
                multiple
              />
              <label class="form-label small muted"
                >Files buyers receive after payment (zip or code files, 10 MB
                max in total). Hidden until approved.</label
              ><input
                id="pf"
                type="file"
                class="form-control mb-2"
                multiple
              /><textarea
                id="pc"
                class="form-control code mb-3"
                style="min-height: 100px"
                placeholder="Or paste code here. It is saved as pasted-code.txt"
              ></textarea>
              <div class="d-flex gap-2 align-items-center">
                <button class="btn btn-mint" id="save">Publish</button
                ><button class="btn btn-outline-light d-none" id="cancel">
                  Cancel</button
                ><span class="muted small" id="stat"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div id="foot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin.js"></script>
  </body>
</html>
