<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <title>Marketplace</title>
  </head>
  <body>
    <div id="nav"></div>
    <main class="container py-4">
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <h2 class="me-auto m-0">Marketplace</h2>
        <input id="q" class="form-control w-auto" placeholder="Search..." />
      </div>
      <div class="row g-3" id="list"></div>
      <div class="modal fade" id="viewM" tabindex="-1">
        <div
          class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"
        >
          <div class="modal-content p-3">
            <div class="d-flex">
              <h4 id="vt" class="me-auto"></h4>
              <button
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div id="vc" class="my-3"></div>
            <p id="vd" class="muted"></p>
            <ul id="vf" class="small"></ul>
            <div class="d-flex flex-wrap gap-2 align-items-center">
              <b class="fs-4 me-auto" id="vp" style="color: var(--mint)"></b
              ><a
                id="vdemo"
                class="btn btn-outline-light d-none"
                target="_blank"
                rel="noopener"
                >Open live demo</a
              ><span id="vbuy"></span>
            </div>
            <div class="muted small mt-3">
              <i class="bi bi-lock"></i> The source files unlock after your
              payment is approved.
            </div>
          </div>
        </div>
      </div>
      <div class="modal fade" id="buyM" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content p-3">
            <h4>Pay for <span id="bt"></span></h4>
            <div class="paybox my-3">
              <div>
                1. Send exactly
                <b id="bp" class="fs-5" style="color: var(--mint)"></b> via
                GCash to:
              </div>
              <div class="fs-5 mt-1"><b id="bg"></b></div>
              <div class="muted" id="bn"></div>
              <div class="small mt-2 d-none">Other: <span id="bo"></span></div>
            </div>
            <label class="form-label small muted"
              >2. Paste the reference number from your GCash receipt</label
            ><input
              id="ref"
              class="form-control mb-2"
              placeholder="e.g. 1234567890123"
              autocomplete="off"
            /><label class="small d-block mb-3"
              ><input type="checkbox" id="paid" /> I sent the exact amount to
              the number above</label
            >
            <button class="btn btn-mint w-100" id="sub">
              Submit reference
            </button>
            <div class="muted small mt-2">
              The owner checks the payment in their GCash. The files unlock
              after approval. A reference number can only be used once.
            </div>
          </div>
        </div>
      </div>
    </main>
    <div id="foot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/chrome.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/market.js"></script>
  </body>
</html>
